services:
  # Service name kept as "llama" so dependents on the external "llm" network
  # keep resolving the same hostname. Serves the Qwen3.6-27B GGUF via llama.cpp.
  llama:
    build: .
    # Model + serving flags live in entrypoint.sh (downloads the GGUF on first
    # run into the `models` volume, then execs llama-server). Defaults:
    #   HF_REPO=HauhauCS/Qwen3.6-27B-Uncensored-HauhauCS-Aggressive  HF_QUANT=IQ4_XS
    # IQ4_XS (~15.1GB) is chosen to fit this 16GB Ada RTX 4090 Laptop GPU.
    # Override HF_QUANT to switch quant (e.g. Q6_K_P); clear the volume first.
    ports:
      - "8081:8080"
    restart: unless-stopped
    volumes:
      - models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - default
      - llm

volumes:
  models:

networks:
  llm:
    external: true
